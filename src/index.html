<!doctype html>
<html lang="zh-CN" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="输入剩余额度与重置时间，可视化比较重置前后额度和套餐价值。"><title>重置价值计算器</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b322e'/%3E%3Cpath d='M23 13a8 8 0 1 0 0 7M23 6v7h-7' fill='none' stroke='%23b9f77b' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="heading"><h1>重置价值计算器</h1></div>
<section class="inputs" aria-label="计算条件">
<div class="quota"><label for="remaining">周额度剩余</label><div class="dial-wrap"><svg id="dial" viewBox="0 0 124 124" role="slider" tabindex="0" aria-label="拖动调整剩余周额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><g id="dialTicks" aria-hidden="true"></g><circle class="dial-track" cx="62" cy="62" r="51"/><circle id="dialArc" class="dial-arc" cx="62" cy="62" r="51" transform="rotate(-90 62 62)"/><circle id="dialThumb" class="dial-thumb" r="6" cx="62" cy="11"/></svg><div class="dial-value"><input id="remaining" type="number" value="8" min="0" max="100" step="1" inputmode="decimal"><span>%</span></div></div><div class="quota-presets" aria-label="额度快捷选择"><button type="button" data-quota="10">10%</button><button type="button" data-quota="25">25%</button><button type="button" data-quota="50">50%</button></div></div>
<div class="time-card"><div class="time-heading"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg><label>使用重置的时间</label></div><input id="redeemAt" type="hidden"><div id="redeemAtPicker" class="time-mount"></div><div class="shortcuts"><button id="nowButton" type="button">现在</button><button type="button" data-shift="6">6 小时后</button><button type="button" data-shift="24">1 天后</button></div></div>
<div class="time-card natural"><div class="time-heading"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4m8-4v4M3 9h14"/></svg><label>原自然重置时间</label></div><input id="naturalAt" type="hidden"><div id="naturalAtPicker" class="time-mount"></div><div class="shortcuts"><button type="button" data-days="1">1 天后</button><button type="button" data-days="3">3 天后</button><button type="button" data-days="5">5 天后</button></div></div>
</section>
<section class="chart-panel" aria-label="额度对比图"><div class="chart-heading"><h2>额度变化</h2><span class="recovery"><span id="beforeValue">8%</span><span class="arrow">→</span><strong>100%</strong><span id="restored">+92%</span></span></div><div class="chart-key"><span><i class="solid"></i>使用重置</span><span><i class="dashed"></i>等待自然重置</span></div><div id="plot"><svg id="chart" role="img" aria-labelledby="chartTitle"></svg></div><div class="chart-times"><span>使用重置</span><span id="newResetLabel">新自然重置</span></div><p id="error" class="error" role="alert" hidden></p></section>
<section class="results" aria-label="各套餐重置价值" aria-live="polite"><article><div class="plan-row"><span class="plan">Plus</span><span class="price">$20 / 月</span></div><div class="amount" id="plus">—</div></article><article><div class="plan-row"><span class="plan">Pro 5×</span><span class="price">$100 / 月</span></div><div class="amount" id="pro5">—</div></article><article><div class="plan-row"><span class="plan">Pro 20×</span><span class="price">$200 / 月</span></div><div class="amount" id="pro20">—</div></article></section>
<footer>按额度用满、重置后重新计 7 天估算；扣除延期成本，月按 30 天。</footer>
</main>
<script src="resolve-date.js"></script><script src="picker.js"></script><script src="engine.js"></script><script src="chart-layout.js"></script><script src="app.js"></script></body></html>
